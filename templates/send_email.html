<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{{ subject }}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            font-family: Arial, sans-serif;
            line-height: 1.6;
            color: #333;
            margin: 0;
            padding: 0;
        }
        .header {
            background-color: #004aad;
            color: white;
            padding: 15px;
            text-align: center;
            font-size: 20px;
        }
        .content {
            padding: 20px;
        }
        .footer {
            background-color: #f2f2f2;
            color: #777;
            text-align: center;
            padding: 15px;
            font-size: 13px;
        }
    </style>
</head>
<body>
    <div class="header">Gokap</div>

    <div class="content">
        <p>Dear {{ user.first_name }},</p>

        <p><strong>{{ subject }}</strong></p>

        <p>{{ body|safe }}</p>

        <p>Best regards,<br><strong>Gokap Team</strong></p>
    </div>

    <div class="footer">
        &copy; {{ current_year }} Gokap Inc. All rights reserved.
    </div>
</body>
</html>
